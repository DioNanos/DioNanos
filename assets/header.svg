<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="DioNanos terminal">
  <style>
    .bg { fill: #0a0e0a; }
    .frame { fill: none; stroke: #00cc6633; stroke-width: 1.5; }
    .scan { fill: #00cc66; opacity: 0.025; }
    text { font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, monospace; }
    .prompt { fill: #00cc66; font-size: 15px; }
    .cmd { fill: #c8facc; font-size: 15px; }
    .out { fill: #7ee0a3; font-size: 15px; }
    .dim { fill: #3f7a55; font-size: 15px; }
    .cursor { fill: #00cc66; animation: blink 1.1s steps(1) infinite; }
    .glow { fill: none; stroke: #00cc66; stroke-opacity: 0.06; stroke-width: 6; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect class="bg" x="0" y="0" width="860" height="150" rx="10"/>
  <rect class="frame" x="1" y="1" width="858" height="148" rx="10"/>
  <rect class="glow" x="4" y="4" width="852" height="142" rx="9"/>
  <!-- scanlines -->
  <g>
    <rect class="scan" x="0" y="12"  width="860" height="2"/>
    <rect class="scan" x="0" y="30"  width="860" height="2"/>
    <rect class="scan" x="0" y="48"  width="860" height="2"/>
    <rect class="scan" x="0" y="66"  width="860" height="2"/>
    <rect class="scan" x="0" y="84"  width="860" height="2"/>
    <rect class="scan" x="0" y="102" width="860" height="2"/>
    <rect class="scan" x="0" y="120" width="860" height="2"/>
    <rect class="scan" x="0" y="138" width="860" height="2"/>
  </g>
  <!-- window dots -->
  <circle cx="22" cy="22" r="4.5" fill="#1d3a28"/>
  <circle cx="40" cy="22" r="4.5" fill="#1d3a28"/>
  <circle cx="58" cy="22" r="4.5" fill="#00cc66" opacity="0.55"/>

  <text x="24" y="62"><tspan class="prompt">dag@forge:~$ </tspan><tspan class="cmd">whoami</tspan></text>
  <text x="24" y="88"><tspan class="out">DioNanos</tspan><tspan class="dim"> — Rust-first MCP stack · AI agents for edge &amp; Android</tspan></text>
  <text x="24" y="124"><tspan class="prompt">dag@forge:~$ </tspan><tspan class="cmd">ls products/</tspan></text>
  <rect class="cursor" x="332" y="111" width="9" height="16"/>
</svg>
